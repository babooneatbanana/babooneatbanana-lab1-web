<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proximity of VSB public schools to bikeways</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
container: 'map',
style: 'https://babooneatbanana.github.io/babooneatbanana-lab1-web/2nd_osm_liberty_style.json',        // the file you downloaded from Maputnik
center: [-123.11, 49.25],    // longitude, latitude
zoom: 11
});
map.addControl(new maplibregl.NavigationControl());
</script>
<h1>Legend</h1>
  <p>= Public Schools<br />
  = Protected lane<br />
  = Local street lane<br />
  = Painted lane<br />
  = Shared lane</p>
</body>
</html>

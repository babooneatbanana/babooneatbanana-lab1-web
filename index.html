<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bikeways and Schools</title>
</head>
<body>
<h4> 
  <img src="https://babooneatbanana.github.io/babooneatbanana-lab1-web/download.png" style="max-width: 100%; height: auto;">
</h4>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style> body { margin: 0; } 
  #map { position: absolute; inset: 0; }
</style>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
container: 'map',
style: 'https://babooneatbanana.github.io/babooneatbanana-lab1-web/5th_osm_liberty_style.json',        // the file you downloaded from Maputnik
center: [-123.11, 49.25],    // longitude, latitude
zoom: 11
});
map.on('click', 'PublicSchools', onEachSchool);
function onEachSchool(e) {
const School = e.features[0].properties;
const popup = new maplibregl.Popup();
popup.setText(School.school_name);
popup.addTo(map);
}
</script>
</body>
</html>

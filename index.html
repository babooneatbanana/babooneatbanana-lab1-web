<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proximity of VSB public schools to bikeways</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
container: 'map',
style: 'https://babooneatbanana.github.io/babooneatbanana-lab1-web/2nd_osm_liberty_style.json',        // the file you downloaded from Maputnik
center: [-123.11, 49.25],    // longitude, latitude
zoom: 11
});
  <!-- The Legend Overlay Container -->
  <div class="map-legend">
    <h4>Legend</h4>
    
    <div class="public-schools">
      <span class="legend-color" style="background-color: #98539B;"></span>
      <span class="legend-label">Public Schools</span>
    </div>
    
    <div class="legend-item">
      <span class="legend-color" style="background-color: #ffa500;"></span>
      <span class="legend-label">Moderate Traffic</span>
    </div>
    
    <div class="legend-item">
      <span class="legend-color" style="background-color: #2ecc71;"></span>
      <span class="legend-label">Low Traffic</span>
    </div>
  </div>
map.addControl(new maplibregl.NavigationControl());
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<h2>Bikeway safety levels (protected, local street, <br /> 
  painted, shared) and public school locations in <br /> 
  Vancouver
</h2>
<title>Bikeways and Schools</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
container: 'map',
style: '3rd_osm_liberty_style.json',        // the file you downloaded from Maputnik
center: [-123.11, 49.25],    // longitude, latitude
zoom: 11
});
map.addControl(new maplibregl.NavigationControl());
</script>
</body>
</html>
